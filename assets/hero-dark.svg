<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
<title id="t">Pavan Koka</title>
<desc id="d">Frontend engineer. WebGL, real-time UI, frame budgets. Styled as a 16.6ms performance trace.</desc>
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .tick { font-size: 12px; fill: #5c5c6e; }
  .bl { font-size: 11px; font-weight: 600; }
  .bar { transform-box: fill-box; transform-origin: left center; animation: grow 9s cubic-bezier(.2,.8,.2,1) infinite both; }
  .name { animation: rise 9s cubic-bezier(.2,.8,.2,1) infinite both; }
  .sub  { animation: rise 9s cubic-bezier(.2,.8,.2,1) .25s infinite both; }
  .head { animation: sweep 9s linear infinite both; }
  .done { animation: commit 9s ease-out infinite both; }
  .rec  { animation: blink 1.2s steps(2, jump-none) infinite; }
  @keyframes grow   { 0% { transform: scaleX(0); opacity: 0 } 10% { opacity: 1 } 22% { transform: scaleX(1) } 90% { transform: scaleX(1); opacity: 1 } 100% { transform: scaleX(1); opacity: 0 } }
  @keyframes rise   { 0%, 4% { transform: translateY(14px); opacity: 0 } 14% { transform: none; opacity: 1 } 92% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes sweep  { 0%, 6% { transform: translateX(0); opacity: 0 } 8% { opacity: 1 } 40% { transform: translateX(1040px); opacity: 1 } 46%, 100% { transform: translateX(1040px); opacity: 0 } }
  @keyframes commit { 0%, 40% { opacity: 0; transform: translateX(-8px) } 46%, 90% { opacity: 1; transform: none } 100% { opacity: 0 } }
  @keyframes blink  { 0% { opacity: 1 } 100% { opacity: .2 } }
  @media (prefers-reduced-motion: reduce) {
    .bar, .name, .sub, .done { animation: none; opacity: 1; transform: none; }
    .head, .rec { animation: none; opacity: 0; }
  }
</style>
<rect width="1200" height="340" rx="16" fill="#050508"/>
<g stroke="#00b4ff" stroke-opacity="0.07" stroke-width="1"><line x1="80.0" y1="56" x2="80.0" y2="316" /><line x1="205.3" y1="56" x2="205.3" y2="316" /><line x1="330.6" y1="56" x2="330.6" y2="316" /><line x1="455.9" y1="56" x2="455.9" y2="316" /><line x1="581.2" y1="56" x2="581.2" y2="316" /><line x1="706.5" y1="56" x2="706.5" y2="316" /><line x1="831.8" y1="56" x2="831.8" y2="316" /><line x1="957.1" y1="56" x2="957.1" y2="316" /><line x1="1082.4" y1="56" x2="1082.4" y2="316" /><line x1="1120.0" y1="56" x2="1120.0" y2="316" /></g>
<g class="mono tick"><text x="80.0" y="48" text-anchor="middle">0ms</text><text x="330.6" y="48" text-anchor="middle">4ms</text><text x="581.2" y="48" text-anchor="middle">8ms</text><text x="831.8" y="48" text-anchor="middle">12ms</text><text x="1120.0" y="48" text-anchor="middle">16.6ms</text></g>
<g class="mono" font-size="12" fill="#5c5c6e">
  <circle class="rec" cx="84" cy="24" r="4" fill="#ff4d6d"/>
  <text x="96" y="28">recording · koka-lab / performance</text>
  <text x="1120" y="28" text-anchor="end">budget 16.6ms · target 60fps</text>
</g>
<text class="sans name" x="80" y="146" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#f4f4f8">Pavan Koka</text>
<text class="mono sub" x="82" y="186" font-size="17" fill="#5c5c6e">frontend engineer <tspan fill="#00ffc8">·</tspan> webgl <tspan fill="#00ffc8">·</tspan> real-time ui <tspan fill="#00ffc8">·</tspan> one frame at a time</text>
<g class="mono"><g class="bar" style="animation-delay:0.60s"><rect x="80.0" y="230" width="1037.0" height="20" rx="3" fill="#3c64ff" fill-opacity="0.22"/><text x="88.0" y="244" class="bl" fill="#f4f4f8">Frame</text></g><g class="bar" style="animation-delay:0.65s"><rect x="105.1" y="256" width="197.5" height="20" rx="3" fill="#00b4ff" fill-opacity="0.9"/><text x="113.1" y="270" class="bl" fill="#050508">Input</text></g><g class="bar" style="animation-delay:1.08s"><rect x="330.6" y="256" width="360.4" height="20" rx="3" fill="#00ffc8" fill-opacity="0.9"/><text x="338.6" y="270" class="bl" fill="#050508">rAF · update()</text></g><g class="bar" style="animation-delay:1.82s"><rect x="719.0" y="256" width="159.9" height="20" rx="3" fill="#00b4ff" fill-opacity="0.9"/><text x="727.0" y="270" class="bl" fill="#050508">Style</text></g><g class="bar" style="animation-delay:2.16s"><rect x="894.5" y="256" width="185.0" height="20" rx="3" fill="#3c64ff" fill-opacity="0.9"/><text x="902.5" y="270" class="bl" fill="#050508">Composite</text></g><g class="bar" style="animation-delay:1.13s"><rect x="355.7" y="282" width="147.4" height="20" rx="3" fill="#00b4ff" fill-opacity="0.9"/><text x="363.7" y="296" class="bl" fill="#050508">physics</text></g><g class="bar" style="animation-delay:1.44s"><rect x="518.6" y="282" width="147.4" height="20" rx="3" fill="#00ffc8" fill-opacity="0.9"/><text x="526.6" y="296" class="bl" fill="#050508">draw</text></g><g class="bar" style="animation-delay:2.20s"><rect x="913.3" y="282" width="97.2" height="20" rx="3" fill="#00ffc8" fill-opacity="0.9"/><text x="921.3" y="296" class="bl" fill="#050508">GPU</text></g></g>
<g class="head"><line x1="80" y1="56" x2="80" y2="316" stroke="#00ffc8" stroke-width="1.5"/><path d="M75 56 h10 l-5 7 z" fill="#00ffc8"/></g>
<g class="done mono"><text x="1120" y="146" text-anchor="end" font-size="14" fill="#00ffc8">16.6ms ▸ frame committed ✓</text>
<text x="1120" y="168" text-anchor="end" font-size="12" fill="#5c5c6e">0 dropped · 0 long tasks</text></g>
</svg>
